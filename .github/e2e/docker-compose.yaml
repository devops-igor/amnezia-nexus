# Deployment used by the DEV Server E2E gate.
#
# The gate deploys the panel on the runner itself, so it must not depend on a
# compose file already existing on the host: on a GitHub-hosted runner nothing
# survives between runs. This file is the canonical shape for that purpose, and
# it maps the panel to 8443 because the workflow probes
# http://127.0.0.1:8443/api/health.
#
# It mirrors the deployment documented in README.md, with the port that the gate
# addresses. Values the gate overrides at runtime (the image tag and the two E2E
# environment variables) stay at their defaults here.
services:
  amnezia-panel:
    image: ghcr.io/devops-igor/amnezia-nexus:latest
    container_name: amnezia-panel
    restart: unless-stopped
    ports:
      - "8443:5000"
      - "51820:51820/udp"
    volumes:
      - panel-data:/app/data
    # The panel runs as a non-root user and carries file capabilities, so these
    # must also be in the container's bounding set or the binary cannot start.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 2
      net.ipv4.conf.all.accept_local: 1
    environment:
      - PORT=5000
      - DATA_DIR=/app/data
      - LOG_LEVEL=INFO
      - VPN_ENABLED=true
      - VPN_LISTEN_PORT=51820
      - VPN_SUBNET=10.100.0.0/16
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  panel-data:
