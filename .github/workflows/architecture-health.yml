name: Architecture Health & Churn Report

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-health:
    name: Architecture Health Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Architecture Health Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.4 pytest-cov==6.0.0
          python -m pytest -v tests/test_architecture_health*.py

      - name: Run Architecture Health Scan
        run: |
          python3 scripts/architecture_health.py --check --nonblocking

      # Section 4.3 permits a size transition when the PR carries a stated
      # per-PR responsibility justification. A maintainer grants that by applying
      # the `sg1-size-exception` label (needs triage or write access, so a
      # contributor cannot self-grant it); the justification itself is a statement
      # in the PR body under a "## SG1 responsibility justification" heading.
      # Both are read from the event payload below, so this step needs no token.
      - name: Enforce SG1 size rule for this pull request
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 scripts/architecture_health.py --check-pr-size --head-ref "${PR_HEAD_SHA}"

      - name: Upload Architecture Health Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: architecture-health-report
          path: architecture_health_report.json
          retention-days: 14
