name: Architecture Health & Churn Report

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-health:
    name: Architecture Health Report
    runs-on: [self-hosted, linux, x64, container-vm]
    container:
      image: localhost:5000/nexus-ci-job:latest
      options: --cpus 4 --memory 6g
    timeout-minutes: 10
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust this job workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Architecture Health Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.4 pytest-cov==6.0.0
          python -m pytest -v tests/test_architecture_health*.py

      - name: Run Architecture Health Scan
        run: |
          python3 scripts/architecture_health.py --check --nonblocking

      # Offline control for the #726 qualification preflight and collector. The shipped step
      # bodies are extracted from .github/workflows/ci.yml and executed against a throwaway
      # runner sandbox, so a regression in partial-initialization handling or in the
      # invocation-local Git trust fails here instead of on the self-hosted runner. Needs only
      # bash and git: no container, no runner state, no operator setup, and no dependency on a
      # previous run's success.
      - name: Verify CI qualification preflight controls
        run: python3 scripts/check_ci_qualification_controls.py

      - name: Upload Architecture Health Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: architecture-health-report
          path: architecture_health_report.json
          retention-days: 14
