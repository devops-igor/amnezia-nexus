name: Isolated runner smoke
on:
  push:
    branches: [ci/runner-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, isolated-vm]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and guest Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f go.mod
          test "$(docker info --format '{{.Name}}')" = ci-runner
          docker version
          docker run --rm alpine:3.20 sh -c 'echo guest-container-ok'
          mkdir -p smoke-output
          printf '%s\n' "$GITHUB_SHA" > smoke-output/source-sha.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-runner-smoke
          path: smoke-output/
          retention-days: 1
