name: High padding qualification probe
on:
  push:
    branches: [ci/runner-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix-probe:
    runs-on: [self-hosted, linux, x64, isolated-vm]
    timeout-minutes: 15
    env:
      GOFLAGS: -tags=with_utls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Repeat exact failing reference and subject case
        run: go test -v -race -count=10 -timeout=10m ./internal/vpn -run '^TestDifferential_ParameterMatrixAndS4Regression$/^High_Padding_S4_Boundary$'
