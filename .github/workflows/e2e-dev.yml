name: DEV Server E2E Verification

'on':
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      qualification:
        description: 'Qualification mode to execute (standard, bounded, full)'
        required: true
        default: 'bounded'
        type: choice
        options:
          - 'standard'
          - 'bounded'
          - 'full'

concurrency:
  group: dev-server-deployment
  cancel-in-progress: false

jobs:
  e2e-dev:
    name: DEV Server E2E Verification
    # GitHub-hosted runner: the gate deploys the panel and its data plane on the
    # runner itself, so it needs no reachability to a lab host. The four-core ARM
    # SBC that used to host it stalled under load and produced false failures
    # (issue 928), and hosted minutes are free for a public repository.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # internal/vpn does not compile without this tag (tags_guard.go enforces
      # it deliberately), and the qualification stages run `go test ./internal/vpn`.
      # ci.yml sets the same flag workflow-wide; this workflow never did, which
      # stayed hidden only because the stages were skipped while the lifecycle failed.
      GOFLAGS: -tags=with_utls
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          # No setup-go cache on this runner. It is persistent, so ~/go/pkg/mod
          # and ~/.cache/go-build already survive between runs. The action's
          # archive stores module paths relative to the workspace
          # (../../../../go/pkg/mod/...), so restoring it extracts onto those
          # existing read-only files: about 60,000 tar "File exists" errors, a
          # ~975 MB download and ~4 minutes of extraction that restores
          # nothing, and the step still reports success. The post step then
          # spends ~4.5 minutes building an archive whose key already exists
          # and cannot be reserved. With the cache off the go commands below
          # use the local caches and fetch any missing module on demand, so a
          # wiped runner is slower rather than broken.
          cache: false

      - name: Ensure Toolchain in PATH
        run: |
          if ! command -v go >/dev/null 2>&1; then
            if [ -d "/usr/local/go/bin" ]; then
              echo "/usr/local/go/bin" >> "$GITHUB_PATH"
            fi
          fi

      - name: Determine Qualification Mode
        id: qual-mode
        run: |
          MODE="${{ github.event.inputs.qualification || 'bounded' }}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Selected Qualification Mode: ${MODE}"

      - name: Build PR Docker Image
        run: |
          docker build -t "ghcr.io/devops-igor/amnezia-nexus:pr-${{ github.event.pull_request.number || 'manual' }}" .

      - name: Clean-Slate Deployment
        run: |
          docker rm -f amnezia-awg2 2>/dev/null || true
          sudo ip link del awg0 2>/dev/null || true
          cd ~ && docker compose down -v 2>/dev/null || true
          # A hosted runner begins with no compose file, so seed the canonical
          # deployment rather than assuming one exists. On a host that already
          # has one, this leaves it alone.
          if [ ! -f ~/docker-compose.yaml ]; then
            cp "${GITHUB_WORKSPACE}/.github/e2e/docker-compose.yaml" ~/docker-compose.yaml
            echo "Seeded ~/docker-compose.yaml from .github/e2e/docker-compose.yaml"
          fi
          PR_TAG="pr-${{ github.event.pull_request.number || 'manual' }}"
          sed -i "s|image: ghcr.io/devops-igor/amnezia-nexus:.*|image: ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}|" ~/docker-compose.yaml
          cat << EOF > ~/docker-compose.override.yaml
          services:
            amnezia-panel:
              image: ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}
              environment:
                - E2E_TESTING=true
                - GIGAHOST_CALL_TIMING=1
          EOF
          cd ~ && docker compose up -d
          echo "Waiting for panel health endpoint..."
          READY=0
          for i in $(seq 1 45); do
            if curl -s -f http://127.0.0.1:8443/api/health >/dev/null 2>&1; then
              echo "Panel is healthy after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Error: Panel failed to become healthy within 45 seconds" >&2
            echo "Readiness service output omitted to protect private fixture data." >&2
            exit 1
          fi
          echo "Verifying running image is PR image ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}..."
          RUNNING_IMAGE=$(docker inspect --format='{{.Config.Image}}' amnezia-panel)
          echo "Running image: ${RUNNING_IMAGE}"
          if [ "${RUNNING_IMAGE}" != "ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}" ]; then
            echo "Error: Running wrong image ${RUNNING_IMAGE}, expected ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}" >&2
            exit 1
          fi
          echo "Verifying E2E_TESTING flag inside container..."
          if [ "$(docker exec amnezia-panel printenv E2E_TESTING)" != "true" ]; then
            echo "Error: E2E_TESTING is not enabled inside container" >&2
            exit 1
          fi
          # The host shell does not propagate into the container: assert the
          # timing flag actually ARRIVED in the panel process, otherwise the
          # collector would legitimately find nothing and the run would silently
          # produce no timing evidence.
          echo "Verifying GIGAHOST_CALL_TIMING flag inside container..."
          if [ "$(docker exec amnezia-panel printenv GIGAHOST_CALL_TIMING)" != "1" ]; then
            echo "Error: GIGAHOST_CALL_TIMING is not enabled inside container" >&2
            exit 1
          fi

      - name: Naive Caddy preflight
        # Verify the exact image the installer will pull, including that it still
        # advertises forward_proxy. This also pre-pulls it, so the install inside
        # the suite is a cache hit instead of a cold pull in the 120s budget.
        run: |
          IMAGE="$(sed -n 's/.*NaiveImageRepository *= *"\([^"]*\)".*/\1/p' internal/manager/naive/naive.go)"
          DIGEST="$(sed -n 's/.*NaiveImageDigest *= *"\([^"]*\)".*/\1/p' internal/manager/naive/naive.go)"
          if [ -z "$IMAGE" ] || [ -z "$DIGEST" ]; then
            echo "Error: could not read the pinned Naive image reference from naive.go" >&2
            exit 1
          fi
          NAIVE_CADDY_IMAGE="${IMAGE}@${DIGEST}" ./scripts/preflight_naive_caddy.sh

      - name: Run Playwright E2E Lifecycle Suite
        run: |
          python3 -m venv ~/e2e-venv
          source ~/e2e-venv/bin/activate
          pip install --quiet -r tests/e2e/requirements.txt
          python -m pytest tests/test_vpn_diagnostics_oracle.py -p no:cacheprovider
          python -m pytest tests/test_e2e_diagnostics_privacy.py -p no:cacheprovider

          # `--with-deps` shells out to apt-get, and this host also runs
          # apt-daily / unattended-upgrades. When either holds the dpkg frontend
          # lock, apt exits 100 and the whole step dies before any test runs
          # (issue #850: "Could not get lock /var/lib/dpkg/lock-frontend. It is
          # held by process <pid> (apt)"). Split the two phases and wait that
          # contention out for a bounded time, then install the browser itself.
          # This needs no change to the host's apt configuration. A lock that
          # never clears still fails the step, naming the holder and the wait,
          # so the suite can never run without its browser.
          PLAYWRIGHT_LOCK_WAIT_SECONDS=300
          PLAYWRIGHT_LOCK_POLL_SECONDS=10
          PLAYWRIGHT_DEPS_LOG="$(mktemp playwright-install-deps.XXXXXX)"
          PLAYWRIGHT_DEPS_DEADLINE=$((SECONDS + PLAYWRIGHT_LOCK_WAIT_SECONDS))
          PLAYWRIGHT_DEPS_ATTEMPT=0
          while true; do
            PLAYWRIGHT_DEPS_ATTEMPT=$((PLAYWRIGHT_DEPS_ATTEMPT + 1))
            if playwright install-deps chromium >"$PLAYWRIGHT_DEPS_LOG" 2>&1; then
              cat "$PLAYWRIGHT_DEPS_LOG"
              echo "Playwright browser dependencies ready (attempt ${PLAYWRIGHT_DEPS_ATTEMPT})."
              break
            else
              PLAYWRIGHT_DEPS_STATUS=$?
              cat "$PLAYWRIGHT_DEPS_LOG"
              if ! grep -qiE 'could not get lock|unable to acquire the dpkg frontend lock|unable to lock directory' "$PLAYWRIGHT_DEPS_LOG"; then
                echo "Error: playwright install-deps failed for a reason other than dpkg lock contention (exit ${PLAYWRIGHT_DEPS_STATUS}); not retrying." >&2
                exit "${PLAYWRIGHT_DEPS_STATUS}"
              fi
              PLAYWRIGHT_DEPS_REMAINING=$((PLAYWRIGHT_DEPS_DEADLINE - SECONDS))
              if [ "$PLAYWRIGHT_DEPS_REMAINING" -le 0 ]; then
                echo "Error: the dpkg lock was still held after ${PLAYWRIGHT_LOCK_WAIT_SECONDS}s and ${PLAYWRIGHT_DEPS_ATTEMPT} attempts; browser dependencies were NOT installed and the E2E suite will not run." >&2
                echo "Lock holders reported by fuser (no output means they could not be read):" >&2
                PLAYWRIGHT_LOCK_HOLDERS="$(timeout 10 sudo -n fuser -v /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock 2>&1 || true)"
                echo "${PLAYWRIGHT_LOCK_HOLDERS:-(none reported)}" >&2
                exit 1
              fi
              if [ "$PLAYWRIGHT_DEPS_REMAINING" -lt "$PLAYWRIGHT_LOCK_POLL_SECONDS" ]; then
                PLAYWRIGHT_DEPS_SLEEP="$PLAYWRIGHT_DEPS_REMAINING"
              else
                PLAYWRIGHT_DEPS_SLEEP="$PLAYWRIGHT_LOCK_POLL_SECONDS"
              fi
              echo "dpkg lock contention on attempt ${PLAYWRIGHT_DEPS_ATTEMPT}; retrying in ${PLAYWRIGHT_DEPS_SLEEP}s (${PLAYWRIGHT_DEPS_REMAINING}s of the ${PLAYWRIGHT_LOCK_WAIT_SECONDS}s budget left)."
              sleep "$PLAYWRIGHT_DEPS_SLEEP"
            fi
          done
          playwright install chromium
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          fi
          touch ~/.ssh/authorized_keys
          grep -q -F -f ~/.ssh/id_ed25519.pub ~/.ssh/authorized_keys 2>/dev/null || cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/id_ed25519.pub
          chmod 700 ~/.ssh
          # The onboarding tests add a server over SSH at the bridge gateway
          # (172.17.0.1:22). A prepared lab machine already runs sshd; a hosted
          # runner does not, so provision it rather than assuming it.
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          sudo mkdir -p /run/sshd
          sudo systemctl start ssh 2>/dev/null || sudo service ssh start 2>/dev/null || sudo /usr/sbin/sshd
          for i in $(seq 1 15); do
            (echo > /dev/tcp/172.17.0.1/22) >/dev/null 2>&1 && break
            sleep 1
          done
          if ! (echo > /dev/tcp/172.17.0.1/22) >/dev/null 2>&1; then
            echo "Error: no SSH daemon reachable at 172.17.0.1:22; the onboarding tests cannot run." >&2
            exit 1
          fi
          echo "SSH daemon reachable at 172.17.0.1:22"
          E2E_BASE_URL="http://127.0.0.1:8443" \
          E2E_ADMIN_USER="admin" \
          E2E_ADMIN_PASS="AdminE2EPass123!" \
          E2E_SERVER_HOST="172.17.0.1" \
          E2E_SERVER_SSH_USER="${USER}" \
          E2E_SERVER_SSH_KEY="${HOME}/.ssh/id_ed25519" \
          E2E_TESTING="true" \
          E2E_REQUIRE_DATAPLANE="true" \
          E2E_TESTED_SOURCE_SHA="${{ github.sha }}" \
          E2E_TESTED_IMAGE_LABEL="ghcr.io/devops-igor/amnezia-nexus:pr-${{ github.event.pull_request.number || 'manual' }}" \
          E2E_PANEL_LOG_CONTAINER="amnezia-panel" \
          ./scripts/run_e2e_lifecycle.sh

      - name: Collect Panel and Install Logs on Failure
        if: failure()
        run: |
          mkdir -p test-artifacts/e2e-diagnostics
          OUT=test-artifacts/e2e-diagnostics/failure-context.txt
          # This repository is public, so artifacts are public. Capture the
          # failure's shape, never a raw log dump: container state plus only the
          # lines that name an install, readiness or protocol failure. Those name
          # a cause; a full tail can carry credentials, session identifiers and
          # fixture data that do not belong in a downloadable artifact.
          {
            echo "==> Containers"
            docker ps -a 2>&1 || true
            echo
            echo "==> Panel log, install and readiness lines only"
            docker logs amnezia-panel --tail 600 2>&1 \
              | grep -aiE "install|readiness|probe|protocol .*(fail|error)|port .* in use" \
              | cut -c1-400 || true
            echo
            echo "==> AWG backend container state"
            docker inspect amnezia-awg2 --format '{{.State.Status}} exit={{.State.ExitCode}}' 2>&1 || true
            docker logs amnezia-awg2 --tail 40 2>&1 \
              | grep -aiE "error|fail|fatal|panic|refus|permission|no such" \
              | cut -c1-400 || true
          } > "$OUT" 2>&1
          echo "Collected failure context: container state and failure-naming lines only."

      - name: Upload Lifecycle Diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-lifecycle-diagnostics-${{ github.run_id }}
          path: test-artifacts/e2e-diagnostics/
          retention-days: 14
          if-no-files-found: warn

      - name: Clean Residual Containers Before Qualification
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          docker rm -f amnezia-awg2 2>/dev/null || true
          sudo ip link del awg0 2>/dev/null || true
          cd ~ && docker compose down -v 2>/dev/null || true

      - name: Prepare Qualification Artifact Directories
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          mkdir -p test-artifacts/runtime test-artifacts/public

      - name: Ensure Qualification Toolchain
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          mkdir -p bin
          # Build and install amneziawg-go userspace daemon if not already available
          if ! command -v amneziawg-go >/dev/null 2>&1; then
            echo "Building amneziawg-go from pinned module..."
            go build -o bin/amneziawg-go github.com/amnezia-vpn/amneziawg-go/v3
            sudo install -m 755 bin/amneziawg-go /usr/local/bin/amneziawg-go
          fi
          # Ensure functional awg CLI tool is available
          if ! awg --version >/dev/null 2>&1; then
            echo "Installing functional awg CLI tool and musl runtime..."
            # The image is musl-built, so the CLI needs the loader for the
            # runner's architecture. Resolve it rather than assuming aarch64.
            case "$(uname -m)" in
              aarch64|arm64) MUSL_LOADER=/lib/ld-musl-aarch64.so.1 ;;
              x86_64|amd64)  MUSL_LOADER=/lib/ld-musl-x86_64.so.1 ;;
              *) echo "Unsupported architecture for the awg CLI tool: $(uname -m)" >&2; exit 1 ;;
            esac
            if [ ! -f "$MUSL_LOADER" ]; then
              sudo docker run --rm --entrypoint cat devopsigor/amneziawg:v3.1.20261116-1 "$MUSL_LOADER" | sudo tee "$MUSL_LOADER" >/dev/null
              sudo chmod 755 "$MUSL_LOADER"
            fi
            sudo docker run --rm --entrypoint cat devopsigor/amneziawg:v3.1.20261116-1 /usr/local/bin/awg | sudo tee /usr/local/bin/awg >/dev/null
            sudo chmod 755 /usr/local/bin/awg
          fi
          echo "Toolchain status:"
          command -v go && go version
          command -v amneziawg-go && amneziawg-go --version 2>&1 | head -n 2 || true
          command -v awg && awg --version || true

      - name: Run Differential Qualification Suite
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          chmod +x ./scripts/run_differential_qualification.sh
          SOAK_FLAG=""
          if [ "${{ steps.qual-mode.outputs.mode }}" = "full" ]; then
            SOAK_FLAG="--soak-full"
          fi
          ./scripts/run_differential_qualification.sh --suite all --no-race $SOAK_FLAG --output-dir test-artifacts/public

      - name: Start Upstream Qualification Subject
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          go build -o bin/qualification-subject ./cmd/qualification-subject
          ./bin/qualification-subject \
            --db-path test-artifacts/runtime/panel_test.db \
            --config-path test-artifacts/runtime/frozen-client.conf \
            --ready-path test-artifacts/runtime/subject.ready \
            --listen-port 51820 \
            --echo-port 40001 \
            --underlay-ip 10.254.250.1 &
          SUBJECT_PID=$!
          echo "$SUBJECT_PID" > test-artifacts/runtime/subject.pid

          echo "Waiting for qualification subject readiness..."
          READY=0
          for i in $(seq 1 30); do
            if [ -f test-artifacts/runtime/subject.ready ]; then
              echo "Qualification subject is ready after ${i}s"
              READY=1
              break
            fi
            if ! kill -0 $SUBJECT_PID 2>/dev/null; then
              echo "Error: Qualification subject exited prematurely" >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Error: Qualification subject failed to become ready within 30 seconds" >&2
            exit 1
          fi

      - name: Run Non-Netstack Client Qualification
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          chmod +x ./scripts/run_non_netstack_client_qualification.sh
          sudo env "PATH=$PATH" ./scripts/run_non_netstack_client_qualification.sh \
            --config test-artifacts/runtime/frozen-client.conf \
            --runtime-dir test-artifacts/runtime \
            --output-dir test-artifacts/public

      - name: Stop Upstream Qualification Subject
        if: always() && steps.qual-mode.outputs.mode != 'standard'
        run: |
          if [ -f test-artifacts/runtime/subject.pid ]; then
            SUBJECT_PID=$(cat test-artifacts/runtime/subject.pid 2>/dev/null || true)
            if [ -n "$SUBJECT_PID" ] && kill -0 $SUBJECT_PID 2>/dev/null; then
              echo "Stopping qualification subject process ($SUBJECT_PID)..."
              kill -TERM $SUBJECT_PID 2>/dev/null || true
              wait $SUBJECT_PID 2>/dev/null || true
            fi
          fi

      - name: Run Upstream Restart Durability Rehearsal
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          chmod +x ./scripts/run_upstream_restart_durability.sh
          sudo env "PATH=$PATH" ./scripts/run_upstream_restart_durability.sh \
            --runtime-dir test-artifacts/runtime \
            --output-dir test-artifacts/public

      - name: Verify Issue #392 Qualification Evidence
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          chmod +x ./scripts/verify_issue392_qualification.sh
          ./scripts/verify_issue392_qualification.sh \
            --artifacts-dir test-artifacts/public \
            --mode ${{ steps.qual-mode.outputs.mode }} \
            --expected-commit "${{ github.sha }}"

      - name: Upload Qualification Evidence Artifacts
        uses: actions/upload-artifact@v7
        if: always() && steps.qual-mode.outputs.mode != 'standard'
        with:
          name: issue392-qualification-evidence-${{ github.run_id }}
          path: test-artifacts/public/
          retention-days: 30

      - name: Post-Test Teardown, Docker Prune & Restoration Invariant
        if: always()
        run: |
          echo "==> Cleaning qualification subject process and network namespaces..."
          if [ -f test-artifacts/runtime/subject.pid ]; then
            SUBJECT_PID=$(cat test-artifacts/runtime/subject.pid 2>/dev/null || true)
            if [ -n "$SUBJECT_PID" ] && kill -0 $SUBJECT_PID 2>/dev/null; then
              kill -9 $SUBJECT_PID 2>/dev/null || true
            fi
          fi
          pkill -9 -f qualification-subject 2>/dev/null || true
          sudo ip netns del nexus-client-ns 2>/dev/null || true
          sudo ip link del veth-nx0 2>/dev/null || true
          sudo ip link del awg-client0 2>/dev/null || true
          rm -rf test-artifacts/runtime/
          echo "==> Cleaning AmneziaWG containers and interfaces..."
          docker rm -f amnezia-awg2 2>/dev/null || true
          sudo ip link del awg0 2>/dev/null || true
          echo "==> Stopping PR container and wiping volume..."
          cd ~ && docker compose down -v 2>/dev/null || true
          echo "==> Removing override file..."
          rm -f ~/docker-compose.override.yaml
          if [ -f ~/docker-compose.yaml ]; then
            echo "==> Resetting ~/docker-compose.yaml to default production image and cleaning legacy lines..."
            sed -i 's|image: ghcr.io/devops-igor/amnezia-nexus:.*|image: ghcr.io/devops-igor/amnezia-nexus:latest|' ~/docker-compose.yaml
            sed -i '/E2E_TESTING/d' ~/docker-compose.yaml
          fi
          echo "==> Pruning Docker system (containers, images, build cache, volumes)..."
          docker system prune -af --volumes
          echo "==> Cleaning up Python E2E virtual environment..."
          rm -rf ~/e2e-venv
          echo "==> Verifying zero running containers on DEV server..."
          RUNNING_CONTAINERS=$(docker ps -q)
          if [ -n "$RUNNING_CONTAINERS" ]; then
            echo "Warning: Leftover containers detected, removing..."
            docker rm -f $RUNNING_CONTAINERS || true
          fi
          echo "==> Post-test teardown complete. DEV server is completely stopped and clean."
