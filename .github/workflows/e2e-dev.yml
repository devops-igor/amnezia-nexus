name: DEV Server E2E Verification

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      qualification:
        description: 'Qualification mode to execute (standard, bounded, full)'
        required: true
        default: 'bounded'
        type: choice
        options:
          - 'standard'
          - 'bounded'
          - 'full'

concurrency:
  group: dev-server-deployment
  cancel-in-progress: false

jobs:
  e2e-dev:
    name: DEV Server E2E Verification
    runs-on: [ self-hosted, linux, arm64, dev ]
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure Toolchain in PATH
        run: |
          if ! command -v go >/dev/null 2>&1; then
            if [ -d "/usr/local/go/bin" ]; then
              echo "/usr/local/go/bin" >> "$GITHUB_PATH"
            fi
          fi

      - name: Determine Qualification Mode
        id: qual-mode
        run: |
          MODE="${{ github.event.inputs.qualification || 'bounded' }}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Selected Qualification Mode: ${MODE}"

      - name: Build PR Docker Image
        run: |
          docker build -t "ghcr.io/devops-igor/amnezia-nexus:pr-${{ github.event.pull_request.number || 'manual' }}" .

      - name: Clean-Slate Deployment
        run: |
          docker rm -f amnezia-awg2 2>/dev/null || true
          sudo ip link del awg0 2>/dev/null || true
          cd ~ && docker compose down -v
          PR_TAG="pr-${{ github.event.pull_request.number || 'manual' }}"
          sed -i "s|image: ghcr.io/devops-igor/amnezia-nexus:.*|image: ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}|" ~/docker-compose.yaml
          cat << EOF > ~/docker-compose.override.yaml
          services:
            amnezia-panel:
              image: ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}
              environment:
                - E2E_TESTING=true
          EOF
          cd ~ && docker compose up -d
          echo "Waiting for panel health endpoint..."
          READY=0
          for i in $(seq 1 45); do
            if curl -s -f http://127.0.0.1:8443/api/health >/dev/null 2>&1; then
              echo "Panel is healthy after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Error: Panel failed to become healthy within 45 seconds" >&2
            docker logs --timestamps --tail 1000 amnezia-panel 2>&1 | python3 "$GITHUB_WORKSPACE/scripts/sanitize_e2e_service_logs.py"
            exit 1
          fi
          echo "Verifying running image is PR image ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}..."
          RUNNING_IMAGE=$(docker inspect --format='{{.Config.Image}}' amnezia-panel)
          echo "Running image: ${RUNNING_IMAGE}"
          if [ "${RUNNING_IMAGE}" != "ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}" ]; then
            echo "Error: Running wrong image ${RUNNING_IMAGE}, expected ghcr.io/devops-igor/amnezia-nexus:${PR_TAG}" >&2
            exit 1
          fi
          echo "Verifying E2E_TESTING flag inside container..."
          if [ "$(docker exec amnezia-panel printenv E2E_TESTING)" != "true" ]; then
            echo "Error: E2E_TESTING is not enabled inside container" >&2
            exit 1
          fi

      - name: Run Playwright E2E Lifecycle Suite
        run: |
          python3 -m venv ~/e2e-venv
          source ~/e2e-venv/bin/activate
          pip install --quiet -r tests/e2e/requirements.txt
          python -m pytest tests/test_e2e_assertions.py tests/test_e2e_service_logs.py -p no:cacheprovider
          playwright install --with-deps chromium
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          fi
          touch ~/.ssh/authorized_keys
          grep -q -F -f ~/.ssh/id_ed25519.pub ~/.ssh/authorized_keys 2>/dev/null || cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/id_ed25519.pub
          chmod 700 ~/.ssh
          E2E_BASE_URL="http://127.0.0.1:8443" \
          E2E_ADMIN_USER="admin" \
          E2E_ADMIN_PASS="AdminE2EPass123!" \
          E2E_SERVER_HOST="172.17.0.1" \
          E2E_SERVER_SSH_KEY="${HOME}/.ssh/id_ed25519" \
          E2E_TESTING="true" \
          E2E_REQUIRE_DATAPLANE="true" \
          ./scripts/run_e2e_lifecycle.sh

      - name: Capture Sanitized Panel Failure Evidence
        id: panel-failure-evidence
        if: failure()
        continue-on-error: true
        env:
          E2E_ADMIN_PASS: "AdminE2EPass123!"
        run: |
          mkdir -p test-artifacts/public/e2e-failure
          docker logs --timestamps --tail 1000 amnezia-panel 2>&1 | python3 scripts/sanitize_e2e_service_logs.py | tee test-artifacts/public/e2e-failure/panel-service.log

      - name: Upload Sanitized Panel Failure Evidence
        uses: actions/upload-artifact@v4
        if: always() && steps.panel-failure-evidence.outcome != 'skipped'
        with:
          name: e2e-panel-failure-${{ github.run_id }}
          path: test-artifacts/public/e2e-failure/
          retention-days: 30
          if-no-files-found: warn

      - name: Clean Residual Containers Before Qualification
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          docker rm -f amnezia-awg2 2>/dev/null || true
          sudo ip link del awg0 2>/dev/null || true
          cd ~ && docker compose down -v 2>/dev/null || true

      - name: Prepare Qualification Artifact Directories
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          mkdir -p test-artifacts/runtime test-artifacts/public

      - name: Ensure Qualification Toolchain
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          mkdir -p bin
          # Build and install amneziawg-go userspace daemon if not already available
          if ! command -v amneziawg-go >/dev/null 2>&1; then
            echo "Building amneziawg-go from pinned module..."
            go build -o bin/amneziawg-go github.com/amnezia-vpn/amneziawg-go/v3
            sudo install -m 755 bin/amneziawg-go /usr/local/bin/amneziawg-go
          fi
          # Ensure functional awg CLI tool is available
          if ! awg --version >/dev/null 2>&1; then
            echo "Installing functional awg CLI tool and musl runtime..."
            if [ ! -f /lib/ld-musl-aarch64.so.1 ]; then
              sudo docker run --rm --entrypoint cat devopsigor/amneziawg:v3.1.20260828-1 /lib/ld-musl-aarch64.so.1 | sudo tee /lib/ld-musl-aarch64.so.1 >/dev/null
              sudo chmod 755 /lib/ld-musl-aarch64.so.1
            fi
            sudo docker run --rm --entrypoint cat devopsigor/amneziawg:v3.1.20260828-1 /usr/local/bin/awg | sudo tee /usr/local/bin/awg >/dev/null
            sudo chmod 755 /usr/local/bin/awg
          fi
          echo "Toolchain status:"
          command -v go && go version
          command -v amneziawg-go && amneziawg-go --version 2>&1 | head -n 2 || true
          command -v awg && awg --version || true

      - name: Run Differential Qualification Suite
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          chmod +x ./scripts/run_differential_qualification.sh
          SOAK_FLAG=""
          if [ "${{ steps.qual-mode.outputs.mode }}" = "full" ]; then
            SOAK_FLAG="--soak-full"
          fi
          ./scripts/run_differential_qualification.sh --suite all --no-race $SOAK_FLAG --output-dir test-artifacts/public

      - name: Start Upstream Qualification Subject
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          go build -o bin/qualification-subject ./cmd/qualification-subject
          ./bin/qualification-subject \
            --db-path test-artifacts/runtime/panel_test.db \
            --config-path test-artifacts/runtime/frozen-client.conf \
            --ready-path test-artifacts/runtime/subject.ready \
            --listen-port 51820 \
            --echo-port 40001 \
            --underlay-ip 10.254.250.1 &
          SUBJECT_PID=$!
          echo "$SUBJECT_PID" > test-artifacts/runtime/subject.pid

          echo "Waiting for qualification subject readiness..."
          READY=0
          for i in $(seq 1 30); do
            if [ -f test-artifacts/runtime/subject.ready ]; then
              echo "Qualification subject is ready after ${i}s"
              READY=1
              break
            fi
            if ! kill -0 $SUBJECT_PID 2>/dev/null; then
              echo "Error: Qualification subject exited prematurely" >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Error: Qualification subject failed to become ready within 30 seconds" >&2
            exit 1
          fi

      - name: Run Non-Netstack Client Qualification
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          chmod +x ./scripts/run_non_netstack_client_qualification.sh
          sudo env "PATH=$PATH" ./scripts/run_non_netstack_client_qualification.sh \
            --config test-artifacts/runtime/frozen-client.conf \
            --runtime-dir test-artifacts/runtime \
            --output-dir test-artifacts/public

      - name: Stop Upstream Qualification Subject
        if: always() && steps.qual-mode.outputs.mode != 'standard'
        run: |
          if [ -f test-artifacts/runtime/subject.pid ]; then
            SUBJECT_PID=$(cat test-artifacts/runtime/subject.pid 2>/dev/null || true)
            if [ -n "$SUBJECT_PID" ] && kill -0 $SUBJECT_PID 2>/dev/null; then
              echo "Stopping qualification subject process ($SUBJECT_PID)..."
              kill -TERM $SUBJECT_PID 2>/dev/null || true
              wait $SUBJECT_PID 2>/dev/null || true
            fi
          fi

      - name: Run Upstream Restart Durability Rehearsal
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          chmod +x ./scripts/run_upstream_restart_durability.sh
          sudo env "PATH=$PATH" ./scripts/run_upstream_restart_durability.sh \
            --runtime-dir test-artifacts/runtime \
            --output-dir test-artifacts/public

      - name: Verify Issue #392 Qualification Evidence
        if: ${{ steps.qual-mode.outputs.mode != 'standard' }}
        run: |
          chmod +x ./scripts/verify_issue392_qualification.sh
          ./scripts/verify_issue392_qualification.sh \
            --artifacts-dir test-artifacts/public \
            --mode ${{ steps.qual-mode.outputs.mode }} \
            --expected-commit "${{ github.sha }}"

      - name: Upload Qualification Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: always() && steps.qual-mode.outputs.mode != 'standard'
        with:
          name: issue392-qualification-evidence-${{ github.run_id }}
          path: test-artifacts/public/
          retention-days: 30

      - name: Post-Test Teardown, Docker Prune & Restoration Invariant
        if: always()
        run: |
          echo "==> Cleaning qualification subject process and network namespaces..."
          if [ -f test-artifacts/runtime/subject.pid ]; then
            SUBJECT_PID=$(cat test-artifacts/runtime/subject.pid 2>/dev/null || true)
            if [ -n "$SUBJECT_PID" ] && kill -0 $SUBJECT_PID 2>/dev/null; then
              kill -9 $SUBJECT_PID 2>/dev/null || true
            fi
          fi
          pkill -9 -f qualification-subject 2>/dev/null || true
          sudo ip netns del nexus-client-ns 2>/dev/null || true
          sudo ip link del veth-nx0 2>/dev/null || true
          sudo ip link del awg-client0 2>/dev/null || true
          rm -rf test-artifacts/runtime/
          echo "==> Cleaning AmneziaWG containers and interfaces..."
          docker rm -f amnezia-awg2 2>/dev/null || true
          sudo ip link del awg0 2>/dev/null || true
          echo "==> Stopping PR container and wiping volume..."
          cd ~ && docker compose down -v
          echo "==> Removing override file..."
          rm -f ~/docker-compose.override.yaml
          echo "==> Resetting ~/docker-compose.yaml to default production image and cleaning legacy lines..."
          sed -i 's|image: ghcr.io/devops-igor/amnezia-nexus:.*|image: ghcr.io/devops-igor/amnezia-nexus:latest|' ~/docker-compose.yaml
          sed -i '/E2E_TESTING/d' ~/docker-compose.yaml
          echo "==> Pruning Docker system (containers, images, build cache, volumes)..."
          docker system prune -af --volumes
          echo "==> Cleaning up Python E2E virtual environment..."
          rm -rf ~/e2e-venv
          echo "==> Verifying zero running containers on DEV server..."
          RUNNING_CONTAINERS=$(docker ps -q)
          if [ -n "$RUNNING_CONTAINERS" ]; then
            echo "Warning: Leftover containers detected, removing..."
            docker rm -f $RUNNING_CONTAINERS || true
          fi
          echo "==> Post-test teardown complete. DEV server is completely stopped and clean."
