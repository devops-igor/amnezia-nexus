name: CSS Differential Oracle

on:
  workflow_dispatch:

concurrency:
  group: css-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css-differential:
    name: CSS Differential Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js for the JavaScript Oracle
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt
          playwright install --with-deps chromium

      - name: Run CSS Computed Style Differential Oracle
        run: pytest tests/e2e/test_css_differential.py -v

      # Exercises the emitted oracle JavaScript in Node. It skips when Node is
      # absent, so Node is provisioned here and the suite is selected explicitly
      # rather than left to a silent skip.
      - name: Run CSS Probe Comparison (Node)
        run: pytest tests/test_css_probe_comparison.py -v
