name: CSS Differential Oracle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: css-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css-differential:
    name: CSS Differential Oracle
    runs-on: [self-hosted, linux, x64, isolated-vm]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt
          playwright install --with-deps chromium

      - name: Set up Node for oracle regression test
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run oracle comparison regression
        run: pytest tests/test_css_probe_comparison.py -v

      - name: Run CSS Computed Style Differential Oracle
        run: pytest tests/e2e/test_css_differential.py -v
