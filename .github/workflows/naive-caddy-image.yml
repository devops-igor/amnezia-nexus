name: Naive Caddy Image

# Publishes the pinned multi-arch image the Naive installer pulls instead of
# compiling Caddy on the target host (issue #680 Phase 1).
#
# The panel references this image by digest, so a published digest is immutable
# and stays pullable after later rebuilds. Bumping the digest is a deliberate
# commit, not a side effect of merging.

on:
  push:
    branches: [ main ]
    paths:
      - docker/naive-caddy/Dockerfile
      - .github/workflows/naive-caddy-image.yml
  pull_request:
    # A pull request that changes the image must prove it builds, and publishing
    # it is how the pinned digest is obtained before the reference is committed.
    paths:
      - docker/naive-caddy/Dockerfile
      - .github/workflows/naive-caddy-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: naive-caddy-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/naive-caddy
          platforms: linux/amd64,linux/arm64
          push: true
          # A plain index digest is what the panel pins; attestation manifests
          # would change the digest without changing the image.
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository }}/naive-caddy:${{ github.sha }}

      - name: Verify the image advertises the forward_proxy module
        run: |
          # amd64 half, natively: proves the built binary is not empty and that
          # the module actually registered. The arm64 half is verified by the
          # DEV preflight before the lifecycle suite runs.
          docker pull "ghcr.io/${{ github.repository }}/naive-caddy@${{ steps.build.outputs.digest }}" --platform linux/amd64
          docker run --rm --platform linux/amd64 \
            "ghcr.io/${{ github.repository }}/naive-caddy@${{ steps.build.outputs.digest }}" \
            caddy list-modules | grep -qx http.handlers.forward_proxy

      - name: Report the pinned digest
        run: |
          {
            echo "### Naive Caddy image published"
            echo '```'
            echo "ghcr.io/${{ github.repository }}/naive-caddy@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Pin this digest in internal/manager/naive/naive.go (NaiveImageDigest)."
          } >> "$GITHUB_STEP_SUMMARY"
