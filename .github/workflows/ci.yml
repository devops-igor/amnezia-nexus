name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -tags=with_utls

jobs:
  lint-and-security:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run go vet
        run: go vet ./...

      # golangci-lint: the golangci-lint-action@v6 downloads prebuilt binaries
      # (built with go1.24) that cannot parse this project's toolchain
      # (go.mod: go 1.26.6) -- and its install-mode: source input is NOT
      # honored for pinned versions (verified: it still downloaded the
      # prebuilt binary). So we build the linter from source ourselves with
      # the runner's Go 1.26, matching local dev (v1.64.8 built go1.26.6).
      - name: Build golangci-lint from source
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Install Security Scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run gosec Security Scanner
        run: gosec -tags with_utls -quiet ./...

      - name: Run govulncheck Vulnerability Scanner
        run: govulncheck ./...

  test:
    name: Automated Test Suite
    runs-on: ubuntu-latest
    # The race/coverage handler package can exceed Go's default 10m per-package
    # timeout while the entire job still has capacity. Keep both limits bounded.
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js for JSDOM Integration Tests
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Pinned jsdom
        run: |
          npm install -g jsdom@29.1.1
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Build Caddy with forwardproxy for Naive Smoke Tests
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
          xcaddy build --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@c096d6a00cb28e019cc1995b04bdc6a9311d8024 --output "$(go env GOPATH)/bin/caddy"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The musl loader comes from the same digest-pinned Alpine image as libgcc,
      # so this step no longer depends on any Ubuntu package mirror. Alpine's
      # loader resolves libc.so from itself and libgcc_s.so.1 through
      # /etc/ld-musl-x86_64.path, which is the layout the pinned NaiveProxy
      # release asset declares (interpreter /lib/ld-musl-x86_64.so.1,
      # NEEDED libgcc_s.so.1 + libc.so). Every step below fails closed; a bad
      # copy must fail here rather than turn the native tests into skips.
      - name: Install musl loader and libgcc for Native NaiveProxy Tests
        run: |
          set -euo pipefail
          ALPINE="alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          docker run --rm -v "$staging:/out" "$ALPINE" sh -euc \
            'apk add --no-cache libgcc && cp -L /lib/ld-musl-x86_64.so.1 /usr/lib/libgcc_s.so.1 /out/'
          test -s "$staging/ld-musl-x86_64.so.1"
          test -s "$staging/libgcc_s.so.1"
          sudo install -D -m 0755 "$staging/ld-musl-x86_64.so.1" /lib/ld-musl-x86_64.so.1
          sudo install -D -m 0644 "$staging/libgcc_s.so.1" /usr/lib/x86_64-linux-musl/libgcc_s.so.1
          printf '/lib\n/usr/lib/x86_64-linux-musl\n' | sudo tee /etc/ld-musl-x86_64.path >/dev/null
          # Usability proof. The loader exits 1 and prints its banner even when
          # nothing loads, so grepping that banner proves nothing; --list must
          # actually execute the loader and parse the installed libgcc as a
          # dynamic object with resolvable dependencies.
          /lib/ld-musl-x86_64.so.1 --list /usr/lib/x86_64-linux-musl/libgcc_s.so.1 >/dev/null
          # NaiveProxy needs these 128-bit helpers; a wrong or truncated libgcc
          # fails relocation at native-test time, so assert them up front.
          grep -qa '__umodti3' /usr/lib/x86_64-linux-musl/libgcc_s.so.1
          grep -qa '__udivti3' /usr/lib/x86_64-linux-musl/libgcc_s.so.1

      - name: Run Tests with Race Detector
        run: go test -race -cover -count=1 -timeout=15m -coverprofile=coverage.out ./...

      - name: Run Authentic Native Caddy Integration Tests
        run: go test -v -race -tags with_utls -run TestCaddyIntegration ./internal/vpn/tunnel/naive/...

      - name: Run Vision Tests (non-race)
        run: go test -tags with_utls -run Vision ./internal/vpn/tunnel/vless/...

      # The automatic AWG admission pair runs inside the package job above, but a
      # package-level PASS reports neither which tests ran nor what the pre-rollback
      # capture observed, so a remote-only AWG stall could not be attributed. This
      # selects the two existing tests by anchored name and keeps -v so their
      # privacy-safe observations reach the log. It adds no assertion and changes no
      # qualification semantics: a failure here still fails the job.
      - name: Run Automatic AWG Admission Consumers
        run: |
          go test -v -race -count=1 -p 2 -parallel 2 -timeout 10m \
            -run '^(TestAutomaticSetupAdmitsAfterAuthenticAWGTraffic|TestAutomaticSetupRefusesWhenTheAWGPeerNeverAnswers)$' \
            ./internal/handlers/

      # The automatic Naive admission trio runs inside the package job above, but a
      # package-level PASS reports neither which tests ran nor whether the payload
      # actually traversed the proxy. This selects them by anchored name and keeps -v
      # so each result and its payload counters are individually visible. It adds no
      # assertion and changes no qualification semantics; a failure here fails the job.
      #
      # A SKIP is the one outcome that would prove nothing: the consumer tests skip when
      # the native binary or the forwardproxy Caddy build is unavailable. Both are
      # provisioned by the steps above, so verify them first and fail closed here rather
      # than letting a missing dependency degrade into a silent skip.
      - name: Verify Automatic Naive Consumer Prerequisites
        run: |
          set -euo pipefail
          # No `|| true` here: a missing binary must fail this step, not be
          # replaced by a fallback that silently points at nothing.
          if caddy_bin="$(command -v caddy)"; then
            :
          else
            caddy_bin="$(go env GOPATH)/bin/caddy"
          fi
          test -x "$caddy_bin"
          "$caddy_bin" list-modules | grep -qx 'http.handlers.forward_proxy'
          # The pinned NaiveProxy release is musl-linked; the loader must resolve a
          # real DT_NEEDED entry, not merely print a banner.
          /lib/ld-musl-x86_64.so.1 --list /usr/lib/x86_64-linux-musl/libgcc_s.so.1 >/dev/null

      - name: Run Automatic Naive Admission Consumers
        run: |
          set -uo pipefail
          log="$(mktemp)"
          go test -v -race -count=1 -p 2 -parallel 2 -timeout 10m \
            -run '^(TestAutomaticSetupAdmitsAfterAuthenticNaivePayload|TestAutomaticSetupRefusesWhenTheNaivePayloadIsNeverAnswered|TestAutomaticSetupRefusesWhenNaiveAuthenticationIsRejected|TestNaiveConsumerFixturesAreNotHandshakeOnly)$' \
            ./internal/handlers/ 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          # A skip is not evidence. This job provisions both prerequisites above, so a
          # skip means the proof did not run and this step must not report success.
          if grep -qE '^--- SKIP: ' "$log"; then
            echo "::error::a Naive admission consumer was skipped, so no traffic proof was produced"
            exit 1
          fi
          exit "$status"

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  diagnostics-privacy:
    name: Offline Diagnostics Privacy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Only the offline suite runs here. It imports no Playwright and loads no
      # e2e fixture, so this intentionally installs neither tests/e2e/requirements.txt
      # nor a browser, and needs only pytest: the privacy contract is enforced on
      # every feature PR without invoking the destructive DEV lifecycle workflow.
      # The console-log suite spawns real pytest subprocesses, so it proves the
      # report boundary (rendered output, exit status, JUnit XML) on ordinary CI.
      # The finalizer suite drives the real lifecycle finalize() path against
      # local stubs (no Docker, SSH, network or provider calls), so the
      # install-failure retention oracle is proven here too, not only locally.
      # The Naive consumer step contract runs the two new workflow step blocks
      # with go/caddy/loader stubs, so its skip guard is proven to fire without
      # a native binary, Caddy build or hosted run.
      - name: Run Offline Diagnostics Privacy Suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.4
          python -m pytest -p no:cacheprovider \
            tests/test_e2e_diagnostics_privacy.py \
            tests/test_e2e_probe_visibility.py \
            tests/test_e2e_install_failure.py \
            tests/test_e2e_install_failure_finalizer.py \
            tests/test_e2e_log_privacy.py \
            tests/test_naive_decoy_default_contract.py \
            tests/test_ci_native_dependencies.py \
            tests/test_ci_naive_consumer_steps.py

  build-matrix:
    name: Cross-Compile Matrix (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Panel Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p bin
          go build -tags with_utls -trimpath -ldflags="-s -w" -o bin/panel-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/panel

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: panel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: bin/panel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          retention-days: 7
