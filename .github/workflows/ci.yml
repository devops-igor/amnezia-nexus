name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -tags=with_utls

defaults:
  run:
    shell: bash

jobs:
  lint-and-security:
    name: Lint & Security Audit
    runs-on: [self-hosted, linux, x64, container-vm]
    container:
      image: localhost:5000/nexus-ci-job:latest
      options: --cpus 4 --memory 6g
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trust this job workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run go vet
        run: go vet ./...

      # golangci-lint: the golangci-lint-action@v6 downloads prebuilt binaries
      # (built with go1.24) that cannot parse this project's toolchain
      # (go.mod: go 1.26.6) -- and its install-mode: source input is NOT
      # honored for pinned versions (verified: it still downloaded the
      # prebuilt binary). So we build the linter from source ourselves with
      # the runner's Go 1.26, matching local dev (v1.64.8 built go1.26.6).
      - name: Build golangci-lint from source
        run: |
          if ! test -x /usr/local/bin/golangci-lint || ! go version -m "/usr/local/bin/golangci-lint" | grep -Eq "^[[:space:]]*mod[[:space:]]+github\.com/golangci/golangci-lint[[:space:]]+v1\.64\.8([[:space:]]|$)" || ! go version -m "/usr/local/bin/golangci-lint" | grep -Fxq "/usr/local/bin/golangci-lint: $(go env GOVERSION)"; then
            tool_dir=$(mktemp -d)
            GOBIN="$tool_dir" go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
            sudo install -m 0755 "$tool_dir/golangci-lint" /usr/local/bin/golangci-lint
            rm -rf "$tool_dir"
          fi
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: /usr/local/bin/golangci-lint run --timeout=5m ./...

      - name: Install Security Scanners
        run: |
          if ! test -x /usr/local/bin/gosec || ! go version -m "/usr/local/bin/gosec" | grep -Eq "^[[:space:]]*mod[[:space:]]+github\.com/securego/gosec/v2[[:space:]]+v2\.30\.0([[:space:]]|$)" || ! go version -m "/usr/local/bin/gosec" | grep -Fxq "/usr/local/bin/gosec: $(go env GOVERSION)"; then
            tool_dir=$(mktemp -d)
            GOBIN="$tool_dir" go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
            sudo install -m 0755 "$tool_dir/gosec" /usr/local/bin/gosec
            rm -rf "$tool_dir"
          fi
          if ! test -x /usr/local/bin/govulncheck || ! go version -m "/usr/local/bin/govulncheck" | grep -Eq "^[[:space:]]*mod[[:space:]]+golang\.org/x/vuln[[:space:]]+v1\.9\.0([[:space:]]|$)" || ! go version -m "/usr/local/bin/govulncheck" | grep -Fxq "/usr/local/bin/govulncheck: $(go env GOVERSION)"; then
            tool_dir=$(mktemp -d)
            GOBIN="$tool_dir" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
            sudo install -m 0755 "$tool_dir/govulncheck" /usr/local/bin/govulncheck
            rm -rf "$tool_dir"
          fi

      - name: Run gosec Security Scanner
        run: /usr/local/bin/gosec -tags with_utls -quiet ./...

      - name: Run govulncheck Vulnerability Scanner
        run: /usr/local/bin/govulncheck ./...

  test:
    name: Automated Test Suite
    runs-on: [self-hosted, linux, x64, container-vm]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # #726 runner qualification, step 1 of 3: bind the evidence to this revision and record
      # the workspace state the tests start from. Read-only; no privilege change.
      - name: Record pre-test runner ownership and workspace state
        run: |
          set -euo pipefail
          {
            echo "runner_host=$(hostname)"
            echo "runner_uid=$(id -u) runner_gid=$(id -g) runner_user=$(id -un)"
            echo "workspace=$GITHUB_WORKSPACE"
            echo "workspace_owner_uid=$(stat -c '%u' "$GITHUB_WORKSPACE")"
            echo "head=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "runner_temp=$RUNNER_TEMP"
          } | tee "$RUNNER_TEMP/runner-qualification-pre.txt" >> "$GITHUB_STEP_SUMMARY"
          ls -lan "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/workspace-pre-test.ls" >> "$GITHUB_STEP_SUMMARY"
          ls -1A "$GITHUB_WORKSPACE" | sort > "$RUNNER_TEMP/workspace-pre-test.names"
          # The historical failure was a directory inside the workspace that the non-root
          # runner user could not unlink from. Unlinking needs write permission on the parent
          # directory, so an unwritable directory anywhere under the workspace is a latent
          # checkout failure. This baseline is recorded, not failed on: state inherited from
          # another job is reported, while step 3 fails on anything this job newly leaves.
          # Git's own object store is excluded: the checkout action maintains it.
          find "$GITHUB_WORKSPACE" -xdev -type d -not -path "$GITHUB_WORKSPACE/.git/*" -not -writable -print \
            | sort > "$RUNNER_TEMP/unwritable-pre-test.txt"
          echo "--- unwritable directories inherited before the tests ---" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/unwritable-pre-test.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ -e "$GITHUB_WORKSPACE/tasks" ]; then
            # Only a root-owned predecessor remnant can survive a successful checkout, and the
            # #726 contract is that ordinary test runs never write here at all.
            echo "::error::repository task area is present before the tests run"
            find "$GITHUB_WORKSPACE/tasks" -maxdepth 2 -ls
            exit 1
          fi
          echo "repo_task_area_absent_before_tests=true" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Set up Node.js for JSDOM Integration Tests
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run setup and tests in the job image
        id: tests
        run: |
          # Match guest paths and loopback so sibling Docker fixtures see test files/services.
          # The socket and /tmp belong to the isolated guest, never the physical host.
          # NET_RAW is required by the #678 policy enablement E2E: the production WAN
          # device opens an AF_PACKET capture socket for direct-WAN return traffic,
          # which CAP_NET_ADMIN alone does not permit.
          docker run --rm -i --user 0:0 --network host --cpus 6 --memory 10g \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_ADMIN --security-opt apparmor=unconfined --device /dev/net/tun \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume /tmp:/tmp \
            --volume "$RUNNER_TOOL_CACHE:$RUNNER_TOOL_CACHE:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env https_proxy --env HTTPS_PROXY --env no_proxy --env NO_PROXY \
            --env GITHUB_WORKSPACE --env GOFLAGS \
            --env GOROOT="$(go env GOROOT)" \
            --env NODE_BIN="$(dirname "$(command -v node)")" \
            localhost:5000/nexus-ci-job:latest bash -seuo pipefail <<'SCRIPT'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          job_tmp=$(mktemp -d /tmp/nexus-tests.XXXXXX)
          trap 'rm -rf "$job_tmp"' EXIT
          # Never reuse /github/home caches: stale modules can lose sqlite vtab build tags.
          export GOPATH="$job_tmp/go" GOMODCACHE="$job_tmp/mod" GOCACHE="$job_tmp/cache"
          export npm_config_prefix="$job_tmp/npm"
          export PATH="$GOROOT/bin:$NODE_BIN:$GOPATH/bin:$npm_config_prefix/bin:$PATH"
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          export SSL_CERT_DIR=/etc/ssl/certs
          node --version
          npm install -g jsdom@29.1.1
          export NODE_PATH="$(npm root -g)"

          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
          "$GOPATH/bin/xcaddy" build --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@c096d6a00cb28e019cc1995b04bdc6a9311d8024 --output "$GOPATH/bin/caddy"

          apt-get update && apt-get install -y musl
          (
            alpine_container=$(docker create alpine:3.20 sh -c "apk add --no-cache libgcc")
            trap 'docker rm -f "$alpine_container" >/dev/null' EXIT
            docker start -a "$alpine_container"
            test "$(docker inspect -f '{{.State.ExitCode}}' "$alpine_container")" = 0
            docker cp "$alpine_container:/usr/lib/libgcc_s.so.1" "$job_tmp/libgcc_s.so.1"
          )
          cp "$job_tmp/libgcc_s.so.1" /usr/lib/x86_64-linux-musl/libgcc_s.so.1

          go test -p 2 -race -cover -count=1 -coverprofile=coverage.out ./...
          go test -v -tags with_utls -race -run TestLinuxE2E ./internal/vpn/forwarder/...
          # Policy enablement (#678). A separate package selection is required
          # because ./internal/vpn/forwarder/... does not include ./internal/vpn,
          # so without this step the policy E2E would be compiled but never run.
          # The production WAN device opens an AF_PACKET capture socket, which needs
          # CAP_NET_RAW in addition to the NET_ADMIN the container already has.
          go test -v -tags with_utls -race -run TestLinuxE2E ./internal/vpn/
          go test -v -race -tags with_utls -run TestCaddyIntegration ./internal/vpn/tunnel/naive/...
          go test -tags with_utls -run Vision ./internal/vpn/tunnel/vless/...

          # #726 runner qualification, step 2 of 3. Runs inside this same root container and
          # proves, with the real producer: caches are invocation-owned (cold by
          # construction), cleanup stays inside this job, and a failed predecessor's partial
          # export cannot leak into this run. No test is skipped; the same named producer
          # test that the suite above already runs is invoked once more against an explicit
          # export directory owned by this invocation.
          qual="$job_tmp/qualification"
          out="$qual/export"
          mkdir -p "$out"
          # /tmp is bind-mounted from the runner, so this directory is how the host-side
          # post-test step reads the container's evidence. Scoped to this invocation only.
          qual_evidence=/tmp/nexus-runner-qualification
          rm -rf "$qual_evidence"
          mkdir -p "$qual_evidence"
          {
            echo "container_uid=$(id -u) container_gid=$(id -g)"
            echo "job_tmp=$job_tmp"
            echo "gocache=$GOCACHE"
            echo "gomodcache=$GOMODCACHE"
            echo "repo_root=$GITHUB_WORKSPACE"
            echo "head=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          } | tee "$qual_evidence/container.txt"
          case "$GOCACHE" in "$job_tmp"/*) echo "gocache_invocation_owned=true" ;; *)
            echo "::error::GOCACHE is not owned by this invocation: $GOCACHE"; exit 1 ;; esac
          case "$out" in "$job_tmp"/*) echo "export_invocation_owned=true" ;; *)
            echo "::error::export directory is not owned by this invocation: $out"; exit 1 ;; esac

          # Predecessor remnants that a cancelled run could leave behind: a truncated public
          # manifest and an orphan temporary file from the same writer.
          printf '{"schema_version":"1.0.0","truncated":' > "$out/evidence_manifest.json"
          printf 'orphan from a cancelled predecessor\n' > "$out/.evidence_manifest.json.tmp-predecessor"
          for attempt in 1 2; do
            NEXUS_ARTIFACT_DIR="$out" go test -tags with_utls -count=1 -timeout 180s \
              -run '^TestDifferential_ConfigFreezingAndRedactedManifest$' ./internal/vpn/
            filedir="$out"
            test -f "$filedir/evidence_manifest.json" || { echo "::error::manifest missing after attempt $attempt"; exit 1; }
            test "$(stat -c '%a' "$filedir/evidence_manifest.json")" = "600" || {
              echo "::error::manifest mode is $(stat -c '%a' "$filedir/evidence_manifest.json"), want 600"; exit 1; }
            test "$(tail -c 1 "$filedir/evidence_manifest.json")" = "}" || {
              echo "::error::manifest is not a complete JSON document after attempt $attempt"; exit 1; }
            grep -q '"schema_version"' "$filedir/evidence_manifest.json" || {
              echo "::error::manifest lacks the expected schema_version field"; exit 1; }
            test -f "$filedir/.evidence_manifest.json.tmp-predecessor" || {
              echo "::error::this invocation deleted a predecessor's temporary file"; exit 1; }
            entries=$(ls -1A "$filedir" | sort | tr '\n' ' ')
            echo "attempt=$attempt entries=$entries"
            test "$entries" = ".evidence_manifest.json.tmp-predecessor evidence_manifest.json " || {
              echo "::error::unexpected entries in the export directory: $entries"; exit 1; }
          done
          echo "predecessor_replaced=true" >> "$qual_evidence/container.txt"
          # Ordinary runs must not write into the repository working tree at all.
          if [ -e "$GITHUB_WORKSPACE/tasks" ]; then
            echo "::error::tests created the repository task area"
            find "$GITHUB_WORKSPACE/tasks" -maxdepth 2 -ls
            exit 1
          fi
          echo "repo_task_area_absent=true" >> "$qual_evidence/container.txt"
          SCRIPT

      # #726 runner qualification, step 3 of 3: prove the next checkout's non-root clean can
      # remove everything this job leaves behind. The historical failure was a root-owned
      # directory the runner user could not unlink from, so the criterion is parent-directory
      # writability, not file modes. Non-destructive apart from this invocation's own /tmp
      # evidence directory.
      - name: Record post-test runner ownership and workspace state
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          ls -lan "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/workspace-post-test.ls" >> "$GITHUB_STEP_SUMMARY"
          ls -1A "$GITHUB_WORKSPACE" | sort > "$RUNNER_TEMP/workspace-post-test.names"
          # If the checkout itself failed there is no pre-test baseline to compare against;
          # report that distinctly instead of crashing on a missing file.
          if [ ! -f "$RUNNER_TEMP/workspace-pre-test.names" ]; then
            : > "$RUNNER_TEMP/workspace-pre-test.names"
          fi
          {
            echo "cleaner_uid=$(id -u) cleaner_user=$(id -un)"
            echo "--- new top-level workspace entries created by this job ---"
            if [ -s "$RUNNER_TEMP/workspace-pre-test.names" ]; then
              comm -13 "$RUNNER_TEMP/workspace-pre-test.names" "$RUNNER_TEMP/workspace-post-test.names"
            else
              echo "(no pre-test baseline: the checkout step did not complete)"
            fi
            echo "--- writability of every directory under the workspace ---"
          } | tee "$RUNNER_TEMP/runner-qualification-post.txt" >> "$GITHUB_STEP_SUMMARY"

          # Report every unwritable directory, then fail only on ones this job introduced.
          find "$GITHUB_WORKSPACE" -xdev -type d -not -path "$GITHUB_WORKSPACE/.git/*" -not -writable -print \
            | sort > "$RUNNER_TEMP/unwritable-post-test.txt"
          printf '%s\n' "--- unwritable directories after the tests ---" >> "$RUNNER_TEMP/runner-qualification-post.txt"
          cat "$RUNNER_TEMP/unwritable-post-test.txt" >> "$RUNNER_TEMP/runner-qualification-post.txt"
          introduced=$(comm -13 "$RUNNER_TEMP/unwritable-pre-test.txt" "$RUNNER_TEMP/unwritable-post-test.txt" 2>/dev/null || true)
          if [ -n "$introduced" ]; then
            echo "::error::this job left directories the next non-root checkout cannot clean: $(printf '%s ' $introduced)"
            exit 1
          fi
          inherited=$(wc -l < "$RUNNER_TEMP/unwritable-post-test.txt")
          echo "unwritable_dirs_inherited=$inherited introduced=0" >> "$RUNNER_TEMP/runner-qualification-post.txt"

          if [ -e "$GITHUB_WORKSPACE/tasks" ]; then
            echo "::error::tests created the repository task area"
            find "$GITHUB_WORKSPACE/tasks" -maxdepth 2 -ls
            exit 1
          fi
          {
            echo "repo_task_area_absent_after_tests=true"
            echo "--- in-container qualification evidence ---"
            cat /tmp/nexus-runner-qualification/container.txt 2>/dev/null \
              || echo "container evidence absent: the in-container qualification step did not complete"
          } | tee -a "$RUNNER_TEMP/runner-qualification-post.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s /tmp/nexus-runner-qualification/container.txt ]; then
            # Absent evidence is only an error when the test step claimed success. If the
            # tests themselves failed, that failure is the real result and must not be
            # masked by a second, misleading qualification error.
            if [ "${TESTS_OUTCOME:-}" = "success" ]; then
              echo "::error::the test step reported success but produced no qualification evidence"
              exit 1
            fi
            echo "qualification_not_produced_because_tests_outcome=${TESTS_OUTCOME:-unknown}" \
              >> "$RUNNER_TEMP/runner-qualification-post.txt"
            exit 0
          fi
          cp /tmp/nexus-runner-qualification/container.txt "$RUNNER_TEMP/container-qualification.txt"
          # Cleanup stays inside this invocation and its own evidence directory.
          rm -rf /tmp/nexus-runner-qualification

      - name: Upload runner qualification evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runner-qualification-evidence
          path: |
            ${{ runner.temp }}/runner-qualification-pre.txt
            ${{ runner.temp }}/workspace-pre-test.ls
            ${{ runner.temp }}/workspace-post-test.ls
            ${{ runner.temp }}/runner-qualification-post.txt
            ${{ runner.temp }}/container-qualification.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  build-matrix:
    name: Cross-Compile Matrix (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: [self-hosted, linux, x64, container-vm]
    container:
      image: localhost:5000/nexus-ci-job:latest
      options: --cpus 4 --memory 6g
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trust this job workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Panel Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p bin
          go build -tags with_utls -trimpath -ldflags="-s -w" -o bin/panel-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/panel

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: panel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: bin/panel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          retention-days: 7
