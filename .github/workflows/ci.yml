name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -tags=with_utls

jobs:
  lint-and-security:
    name: Lint & Security Audit
    runs-on: [self-hosted, linux, x64, isolated-vm]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run go vet
        run: go vet ./...

      # golangci-lint: the golangci-lint-action@v6 downloads prebuilt binaries
      # (built with go1.24) that cannot parse this project's toolchain
      # (go.mod: go 1.26.6) -- and its install-mode: source input is NOT
      # honored for pinned versions (verified: it still downloaded the
      # prebuilt binary). So we build the linter from source ourselves with
      # the runner's Go 1.26, matching local dev (v1.64.8 built go1.26.6).
      - name: Build golangci-lint from source
        run: |
          if ! command -v golangci-lint >/dev/null || ! go version -m "$(command -v golangci-lint)" | grep -q "v1.64.8"; then
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Install Security Scanners
        run: |
          if ! command -v gosec >/dev/null || ! go version -m "$(command -v gosec)" | grep -q "v2.30.0"; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          fi
          if ! command -v govulncheck >/dev/null || ! go version -m "$(command -v govulncheck)" | grep -q "v1.9.0"; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          fi

      - name: Run gosec Security Scanner
        run: gosec -tags with_utls -quiet ./...

      - name: Run govulncheck Vulnerability Scanner
        run: govulncheck ./...

  test:
    name: Automated Test Suite
    runs-on: [self-hosted, linux, x64, isolated-vm]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js for JSDOM Integration Tests
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Pinned jsdom
        run: |
          npm install -g jsdom@29.1.1
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Build Caddy with forwardproxy for Naive Smoke Tests
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
          "$(go env GOPATH)/bin/xcaddy" build --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@c096d6a00cb28e019cc1995b04bdc6a9311d8024 --output "$(go env GOPATH)/bin/caddy"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install musl libc and Alpine libgcc for Native NaiveProxy Tests
        run: |
          sudo apt-get update && sudo apt-get install -y musl
          mkdir -p /tmp/musl-lib
          docker run --rm -v /tmp/musl-lib:/out alpine:3.20 sh -c "apk add --no-cache libgcc && cp /usr/lib/libgcc_s.so.1 /out/"
          sudo cp /tmp/musl-lib/libgcc_s.so.1 /usr/lib/x86_64-linux-musl/libgcc_s.so.1

      - name: Run Tests with Race Detector
        run: go test -race -cover -count=1 -coverprofile=coverage.out ./...

      - name: Run Authentic Native Caddy Integration Tests
        run: go test -v -race -tags with_utls -run TestCaddyIntegration ./internal/vpn/tunnel/naive/...

      - name: Run Vision Tests (non-race)
        run: go test -tags with_utls -run Vision ./internal/vpn/tunnel/vless/...

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  build-matrix:
    name: Cross-Compile Matrix (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: [self-hosted, linux, x64, isolated-vm]
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Panel Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p bin
          go build -tags with_utls -trimpath -ldflags="-s -w" -o bin/panel-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/panel

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: panel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: bin/panel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          retention-days: 7
