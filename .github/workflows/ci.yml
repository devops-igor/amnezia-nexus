name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -tags=with_utls

jobs:
  lint-and-security:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run go vet
        run: go vet ./...

      # golangci-lint: the golangci-lint-action@v6 downloads prebuilt binaries
      # (built with go1.24) that cannot parse this project's toolchain
      # (go.mod: go 1.26.6) -- and its install-mode: source input is NOT
      # honored for pinned versions (verified: it still downloaded the
      # prebuilt binary). So we build the linter from source ourselves with
      # the runner's Go 1.26, matching local dev (v1.64.8 built go1.26.6).
      - name: Build golangci-lint from source
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Install Security Scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run gosec Security Scanner
        run: gosec -tags with_utls -quiet ./...

      - name: Run govulncheck Vulnerability Scanner
        run: govulncheck ./...

  test:
    name: Automated Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js for JSDOM Integration Tests
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Pinned jsdom
        run: |
          npm install -g jsdom@29.1.1
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Build Caddy with forwardproxy for Naive Smoke Tests
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
          xcaddy build --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@c096d6a00cb28e019cc1995b04bdc6a9311d8024 --output "$(go env GOPATH)/bin/caddy"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The musl loader comes from the same digest-pinned Alpine image as libgcc,
      # so this step no longer depends on any Ubuntu package mirror. Alpine's
      # loader resolves libc.so from itself and libgcc_s.so.1 through
      # /etc/ld-musl-x86_64.path, which is the layout the pinned NaiveProxy
      # release asset declares (interpreter /lib/ld-musl-x86_64.so.1,
      # NEEDED libgcc_s.so.1 + libc.so). Every step below fails closed; a bad
      # copy must fail here rather than turn the native tests into skips.
      - name: Install musl loader and libgcc for Native NaiveProxy Tests
        run: |
          set -euo pipefail
          ALPINE="alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          docker run --rm -v "$staging:/out" "$ALPINE" sh -euc \
            'apk add --no-cache libgcc && cp -L /lib/ld-musl-x86_64.so.1 /usr/lib/libgcc_s.so.1 /out/'
          test -s "$staging/ld-musl-x86_64.so.1"
          test -s "$staging/libgcc_s.so.1"
          sudo install -D -m 0755 "$staging/ld-musl-x86_64.so.1" /lib/ld-musl-x86_64.so.1
          sudo install -D -m 0644 "$staging/libgcc_s.so.1" /usr/lib/x86_64-linux-musl/libgcc_s.so.1
          printf '/lib\n/usr/lib/x86_64-linux-musl\n' | sudo tee /etc/ld-musl-x86_64.path >/dev/null
          # Usability proof. The loader exits 1 and prints its banner even when
          # nothing loads, so grepping that banner proves nothing; --list must
          # actually execute the loader and parse the installed libgcc as a
          # dynamic object with resolvable dependencies.
          /lib/ld-musl-x86_64.so.1 --list /usr/lib/x86_64-linux-musl/libgcc_s.so.1 >/dev/null
          # NaiveProxy needs these 128-bit helpers; a wrong or truncated libgcc
          # fails relocation at native-test time, so assert them up front.
          grep -qa '__umodti3' /usr/lib/x86_64-linux-musl/libgcc_s.so.1
          grep -qa '__udivti3' /usr/lib/x86_64-linux-musl/libgcc_s.so.1

      # These four WAN tests fail closed under CI when the runner has no root,
      # /dev/net/tun or private network namespace, which is correct — they must never
      # report success by skipping. They cannot run in this unprivileged job, so they
      # are excluded here and executed for real by the required `wan-qualification` job
      # below. The exclusion is paired one-to-one with that execution: it removes no
      # obligation, it moves each obligation to a step that actually runs it.
      - name: Run Tests with Race Detector
        run: |
          go test -race -cover -count=1 -coverprofile=coverage.out \
            -skip '^(TestS4ProductionContainerHostWANQualification|TestProductionWANDevice_PermissionsAndLifecycle|TestWANCaptureProductionPath|TestLinuxE2E_DirectEgress)$' ./...

      - name: Run Authentic Native Caddy Integration Tests
        run: go test -v -race -tags with_utls -run TestCaddyIntegration ./internal/vpn/tunnel/naive/...

      - name: Run Vision Tests (non-race)
        run: go test -tags with_utls -run Vision ./internal/vpn/tunnel/vless/...

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  diagnostics-privacy:
    name: Offline Diagnostics Privacy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Only the offline suite runs here. It imports no Playwright and loads no
      # e2e fixture, so this intentionally installs neither tests/e2e/requirements.txt
      # nor a browser, and needs only pytest: the privacy contract is enforced on
      # every feature PR without invoking the destructive DEV lifecycle workflow.
      # The console-log suite spawns real pytest subprocesses, so it proves the
      # report boundary (rendered output, exit status, JUnit XML) on ordinary CI.
      # The finalizer suite drives the real lifecycle finalize() path against
      # local stubs (no Docker, SSH, network or provider calls), so the
      # install-failure retention oracle is proven here too, not only locally.
      - name: Run Offline Diagnostics Privacy Suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.4
          python -m pytest -p no:cacheprovider \
            tests/test_e2e_diagnostics_privacy.py \
            tests/test_e2e_probe_visibility.py \
            tests/test_e2e_install_failure.py \
            tests/test_e2e_install_failure_finalizer.py \
            tests/test_e2e_log_privacy.py \
            tests/test_naive_decoy_default_contract.py \
            tests/test_ci_native_dependencies.py

  build-matrix:
    name: Cross-Compile Matrix (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Panel Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p bin
          go build -tags with_utls -trimpath -ldflags="-s -w" -o bin/panel-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/panel

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: panel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: bin/panel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          retention-days: 7

  # Required bounded WAN qualification (issue #677).
  #
  # The direct-WAN dataplane can only be proven by executing real kernel behaviour:
  # a production TUN device, AF_PACKET capture, namespace-local forwarding/NAT and
  # replies that actually arrive. Those tests fail closed under CI when the runner
  # cannot provide root, /dev/net/tun and a private network namespace, so they cannot
  # run in the unprivileged `test` job above — and they must not be excluded from it
  # either, or the required behaviour goes unexercised.
  #
  # This job therefore compiles the test binaries unprivileged and uses sudo for the
  # launch only. Every test here creates and owns its own network namespace, so the
  # job never reconfigures the runner's host networking: no hostwide sysctl, no
  # AppArmor change, no privileged container, no self-hosted runner.
  wan-qualification:
    name: Required WAN Qualification (isolated namespaces)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # A disposable /run/netns so `ip netns` operations in the tests cannot touch a
      # shared mount. It is created by this job and removed by the teardown step.
      - name: Prepare private /run/netns
        run: sudo mkdir -p /run/netns

      - name: Compile the VPN WAN test binary
        run: go test -tags with_utls -c -o "$RUNNER_TEMP/vpn-wan.test" ./internal/vpn

      - name: Run the VPN WAN qualification
        env:
          CI: 'true'
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/vpn-wan.log"
          echo "running: S4 + production lifecycle + capture positive/negative"
          # sudo resets the environment, so the required markers are passed explicitly.
          # Compilation happened unprivileged above; only the launch is elevated.
          sudo env \
            GITHUB_ACTIONS=true CI=true NEXUS_S4_REQUIRED=1 \
            "$RUNNER_TEMP/vpn-wan.test" \
            -test.v -test.timeout=12m \
            -test.run '^(TestS4ProductionContainerHostWANQualification|TestProductionWANDevice_PermissionsAndLifecycle|TestWANCaptureProductionPath)$' \
            > "$LOG" 2>&1
          rc=$?
          cat "$LOG"
          # Exit status alone is not the oracle: a skip or a missing test would look
          # like success, so the log itself is inspected.
          if grep -qE '^--- SKIP' "$LOG"; then
            echo "::error::a required WAN test SKIPPED; a skip is not a pass"
            exit 1
          fi
          if grep -qE '^--- FAIL' "$LOG"; then
            echo "::error::a required WAN test FAILED"
            exit 1
          fi
          for name in \
            TestS4ProductionContainerHostWANQualification \
            TestProductionWANDevice_PermissionsAndLifecycle \
            TestWANCaptureProductionPath
          do
            if ! grep -qE "^--- PASS: $name " "$LOG"; then
              echo "::error::required test did not report PASS: $name"
              exit 1
            fi
          done
          if ! grep -q 'S4 RESULT: PASS' "$LOG"; then
            echo "::error::the S4 verdict line is absent; the direct-WAN path is unproven"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::the qualification process exited $rc"
            exit 1
          fi

      - name: Compile the forwarder WAN test binary
        run: go test -tags with_utls -c -o "$RUNNER_TEMP/fwd-wan.test" ./internal/vpn/forwarder

      - name: Run the forwarder direct-egress qualification
        env:
          CI: 'true'
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/fwd-wan.log"
          echo "running: forwarder direct-egress dispatch/return"
          sudo env GITHUB_ACTIONS=true CI=true NEXUS_S4_REQUIRED=1 \
            "$RUNNER_TEMP/fwd-wan.test" \
            -test.v -test.timeout=10m \
            -test.run '^TestLinuxE2E_DirectEgress$' \
            > "$LOG" 2>&1
          rc=$?
          cat "$LOG"
          if grep -qE '^--- SKIP' "$LOG"; then
            echo "::error::the forwarder WAN gate SKIPPED; a skip is not a pass"
            exit 1
          fi
          if grep -qE '^--- FAIL' "$LOG"; then
            echo "::error::the forwarder WAN gate FAILED"
            exit 1
          fi
          if ! grep -qE '^--- PASS: TestLinuxE2E_DirectEgress ' "$LOG"; then
            echo "::error::required test did not report PASS: TestLinuxE2E_DirectEgress"
            exit 1
          fi
          # This gate has no verdict line; a delivered direct reply is its evidence.
          if ! grep -q 'ECHO:' "$LOG"; then
            echo "::error::no direct echo reply observed; the return path is unproven"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::the forwarder qualification process exited $rc"
            exit 1
          fi

      # Raw logs BEFORE teardown, and on failure too: the evidence is the whole point.
      - name: Upload WAN qualification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wan-qualification-logs
          path: |
            ${{ runner.temp }}/vpn-wan.log
            ${{ runner.temp }}/fwd-wan.log
          retention-days: 14
          if-no-files-found: warn

      # Remove only what this job created. The tests clean their own namespaces; this
      # clears the mountpoint directory we made.
      - name: Clean up job-owned resources
        if: always()
        run: |
          set +e
          sudo ip netns list | awk '{print $1}' | grep -E '^(nexus|s4|wan-|nt)' | while read -r ns; do
            [ -n "$ns" ] && sudo ip netns del "$ns" 2>/dev/null
          done
          sudo rm -rf /run/netns
          rm -f "$RUNNER_TEMP"/vpn-wan.test "$RUNNER_TEMP"/fwd-wan.test
          echo "cleanup complete"
