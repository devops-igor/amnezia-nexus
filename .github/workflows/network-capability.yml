name: Guest network capability verification
on:
  workflow_dispatch:
  push:
    branches: [ci/runner-smoke]
permissions:
  contents: read
jobs:
  capability:
    runs-on: [self-hosted, linux, x64, container-vm]
    timeout-minutes: 5
    steps:
      - name: Verify NET_ADMIN namespaces TUN and NAT in guest container
        run: |
          set -euo pipefail
          docker run --rm --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt apparmor=unconfined --device /dev/net/tun localhost:5000/nexus-ci-job:latest bash -seuo pipefail <<'SCRIPT'
          command -v ip
          command -v iptables
          ip netns add nexus-canary
          trap 'ip netns del nexus-canary' EXIT
          ip link add ci-veth type veth peer name ci-peer
          ip link set ci-peer netns nexus-canary
          ip addr add 10.253.253.1/30 dev ci-veth
          ip link set ci-veth up
          ip -n nexus-canary addr add 10.253.253.2/30 dev ci-peer
          ip -n nexus-canary link set ci-peer up
          ip tuntap add dev ci-tun mode tun
          ip link set ci-tun up
          iptables -t nat -A POSTROUTING -s 10.253.253.0/30 -j MASQUERADE
          iptables -t nat -C POSTROUTING -s 10.253.253.0/30 -j MASQUERADE
          iptables -t nat -D POSTROUTING -s 10.253.253.0/30 -j MASQUERADE
          echo 'PASS: network namespace, veth, TUN and NAT rule lifecycle'
          SCRIPT
