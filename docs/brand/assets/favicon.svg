<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
<title id="title">vpnCAT app icon</title><desc id="desc">vpnCAT's astronaut kitten smiling inside a bold blue space helmet.</desc>
<defs>
<linearGradient id="f-space" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#18376F"/><stop offset=".52" stop-color="#3479EA"/><stop offset="1" stop-color="#78D0FF"/></linearGradient>
<linearGradient id="f-helmet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C6F5FF"/><stop offset=".42" stop-color="#5B9DF6"/><stop offset=".82" stop-color="#3861CB"/><stop offset="1" stop-color="#8A5CF6"/></linearGradient>
<linearGradient id="f-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4FEFF"/><stop offset=".46" stop-color="#BEEBFF"/><stop offset="1" stop-color="#83BEFF"/></linearGradient>
<linearGradient id="f-fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".7" stop-color="#FFF6DF"/><stop offset="1" stop-color="#FFE7C0"/></linearGradient>
<linearGradient id="f-suit" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".58" stop-color="#F4F7FF"/><stop offset="1" stop-color="#BBD8FF"/></linearGradient>
<linearGradient id="f-flare" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1AB"/><stop offset="1" stop-color="#FFD84D"/></linearGradient>
</defs>
<rect x="2" y="2" width="296" height="296" rx="74" fill="url(#f-space)"/>
<g transform="translate(10 10) scale(0.93)" stroke-linejoin="round" stroke-linecap="round">
<!-- visor housing: wide cyan glass helmet with a navy structural rim -->
<circle cx="150" cy="148" r="139" fill="url(#f-helmet)" stroke="#2D2B6F" stroke-width="11"/>
<circle cx="150" cy="148" r="126" fill="#BDEBFF" opacity=".32"/>
<path d="M40 159Q23 92 83 48Q113 25 151 26" stroke="#E7FBFF" stroke-width="10" opacity=".87" fill="none"/>
<path d="M232 52Q261 69 274 104" stroke="#E7FBFF" stroke-width="8" opacity=".8" fill="none"/>
<path d="M266 166Q256 215 228 238" stroke="#294EA6" stroke-width="9" opacity=".42" fill="none"/>
<!-- ear silhouettes are deliberately asymmetric and are part of this character's identity -->
<path d="M77 149L77 62Q78 48 89 54L134 100Z" fill="#FFDB55" stroke="#2D2B6F" stroke-width="8"/>
<path d="M204 102L250 54Q264 44 269 65L263 154Z" fill="#FFDB55" stroke="#2D2B6F" stroke-width="8"/>
<path d="M94 82L96 119L119 108Z" fill="#FF8DA1" opacity=".83"/>
<path d="M241 86L223 106L248 114Z" fill="#FF8DA1" opacity=".83"/>
<!-- warm white kitten face with a golden asymmetric fringe -->
<path d="M67 149Q63 99 109 88Q144 77 164 90Q221 80 242 132Q260 202 203 232Q159 256 109 234Q64 211 67 149Z" fill="url(#f-fur)" stroke="#2D2B6F" stroke-width="8"/>
<path d="M98 103Q126 83 160 92L179 105Q162 109 153 123Q131 111 108 122Z" fill="#FFDE64"/>
<path d="M158 94Q187 83 213 102L204 119Q183 112 166 123Z" fill="#FFCC40"/>
<!-- cheek markings: soft coral + individually drawn freckles -->
<ellipse cx="94" cy="184" rx="21" ry="18" fill="#FF8DA1" opacity=".69"/>
<ellipse cx="217" cy="181" rx="20" ry="17" fill="#FF8DA1" opacity=".69"/>
<g fill="#FFF6FC" opacity=".9"><circle cx="87" cy="178" r="3"/><circle cx="101" cy="176" r="2.5"/><circle cx="91" cy="188" r="2.7"/><circle cx="104" cy="188" r="2"/><circle cx="209" cy="175" r="3"/><circle cx="221" cy="179" r="2.8"/><circle cx="215" cy="188" r="2.3"/></g>
<!-- personality: bright eyes, inquisitive eyebrows, wide mouth + tiny tongue -->
<path d="M105 137Q113 127 122 133M185 130Q193 121 202 130" fill="none" stroke="#2D2B6F" stroke-width="5"/>
<ellipse cx="118" cy="157" rx="10.5" ry="13" fill="#2D2B6F"/><ellipse cx="191" cy="153" rx="10.5" ry="13" fill="#2D2B6F"/>
<ellipse cx="114" cy="151" rx="3.2" ry="4.5" fill="#FFFFFF"/><ellipse cx="187" cy="148" rx="3.2" ry="4.5" fill="#FFFFFF"/>
<path d="M146 170Q154 166 162 169Q158 177 154 176Z" fill="#2D2B6F"/>
<path d="M139 184Q153 196 170 181Q174 211 155 215Q138 210 139 184Z" fill="#2D2B6F"/>
<path d="M148 206Q153 194 164 202" fill="none" stroke="#FF8DA1" stroke-width="9"/>
<!-- whiskers sit away from facial expression -->
<path d="M77 166L59 161M78 179L56 183M233 163L253 159M234 178L255 185" stroke="#2D2B6F" stroke-width="4.5" fill="none"/>
<!-- lower helmet rim, padded ear fixtures, and glass reflection -->
<path d="M64 222Q143 292 235 222" fill="none" stroke="#2D2B6F" stroke-width="10"/>
<path d="M70 232Q151 289 228 232" fill="none" stroke="#76D7FF" stroke-width="8"/>
<rect x="25" y="163" width="24" height="43" rx="11" fill="#E6F9FF" stroke="#2D2B6F" stroke-width="5" transform="rotate(-10 37 184)"/>
<rect x="251" y="162" width="24" height="43" rx="11" fill="#E6F9FF" stroke="#2D2B6F" stroke-width="5" transform="rotate(10 263 184)"/>
<path d="M65 87Q88 47 132 41" fill="none" stroke="#FFFFFF" stroke-width="12" opacity=".86"/>
<ellipse cx="245" cy="85" rx="9" ry="17" transform="rotate(-35 245 85)" fill="#FFFFFF" opacity=".89"/>
<ellipse cx="259" cy="113" rx="5" ry="8" transform="rotate(-35 259 113)" fill="#FFFFFF" opacity=".72"/>
<!-- unique identifying cyan comet seal on helmet -->
<circle cx="73" cy="66" r="17" fill="#00D2D0" stroke="#2D2B6F" stroke-width="5"/>
<path d="M73 55L76 63L85 65L77 70L76 79L70 71L62 68L70 64Z" fill="#FFFFFF"/>
</g>
</svg>
