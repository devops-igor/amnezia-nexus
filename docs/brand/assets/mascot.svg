<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">Captain CAT — vpnCAT astronaut mascot</title><desc id="desc">Original cheerful cream-and-gold astronaut kitten with a cyan helmet, a waving paw, star-map tablet and white spacesuit, floating among satellites, a ringed planet and golden stars.</desc>
