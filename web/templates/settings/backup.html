{{- define "settings_backup" -}}
<!-- BLOCK 6: Backup & Restore -->
        <div class="card settings-section-card">
            <div class="settings-card-header">
                <svg class="icon"><use href="#icon-database"></use></svg>
                <h2 class="card-title">{{ _ "backup_title" }}</h2>
            </div>
            <div class="settings-stack">
                <div class="settings-row">
                    <a href="/api/settings/backup/download" class="btn btn-secondary">
                        <svg class="icon"><use href="#icon-download"></use></svg> {{ _ "download_backup" }}
                    </a>
                </div>
                {{ if is_admin .current_user }}
                <div class="settings-subsection">
                    <div class="settings-stack-sm">
                        <input type="file" id="backupFile" accept=".json" hidden
                            onchange="handleRestore(event)">
                        <button type="button" class="btn btn-secondary"
                            onclick="document.getElementById('backupFile').click()" id="restoreBtn">
                            <svg class="icon"><use href="#icon-upload"></use></svg> <span id="restoreBtnText">{{ _ "restore_backup" }}</span>
                            <div class="spinner spinner-sm hidden" id="restoreSpinner"></div>
                        </button>
                    </div>
                </div>
                {{ end }}
            </div>
            {{ if is_admin .current_user }}
            <p class="form-hint mt-sm">
                {{ _ "restore_confirm" }}
            </p>
            {{ end }}
        </div>
{{- end }}
