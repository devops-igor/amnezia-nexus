{{- define "settings_ssl" -}}
<!-- BLOCK 4: SSL / HTTPS -->
        <div class="card settings-section-card" id="sslCard" data-settings-card="ssl">
            <div class="settings-card-header">
                <svg class="icon"><use href="#icon-lock"></use></svg>
                <h2 class="card-title">{{ _ "ssl_title" }}</h2>
                {{ template "settings_dirty" . }}
            </div>
            <form id="sslForm">
                {{ $sslSettings := get .settings "ssl" }}
                <div class="form-group">
                    <label class="switch-container">
                        <span class="switch">
                            <input type="checkbox" id="ssl_enabled" {{ if get $sslSettings "enabled" }}checked{{ end }}>
                            <span class="switch-slider"></span>
                        </span>
                        <span class="switch-label-text">{{ _ "enable_https" }}</span>
                    </label>
                </div>
                <div class="form-group settings-offset">
                    <label class="form-label" for="panel_port">{{ _ "panel_port_label" }}</label>
                    <input type="number" class="form-input" id="panel_port" value="{{ get $sslSettings "panel_port" 5000 }}" placeholder="5000">
                </div>
                <div id="sslFields" class="settings-offset"{{ if not (get $sslSettings "enabled") }} hidden{{ end }}>
                    <div class="form-group">
                        <label class="form-label" for="ssl_domain">{{ _ "domain_label" }}</label>
                        <input type="text" class="form-input" id="ssl_domain" value="{{ get $sslSettings "domain" "" }}" placeholder="vpn.example.com">
                    </div>

                    <div class="settings-field-pair">
                        <div class="form-group">
                            <label class="form-label" for="ssl_cert_path">{{ _ "cert_path_label" }}</label>
                            <input type="text" class="form-input" id="ssl_cert_path" value="{{ get $sslSettings "cert_path" "" }}" placeholder="/etc/amnezia/cert.pem">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="ssl_key_path">{{ _ "key_path_label" }}</label>
                            <input type="text" class="form-input" id="ssl_key_path" value="{{ get $sslSettings "key_path" "" }}" placeholder="/etc/amnezia/key.pem">
                        </div>
                    </div>

                    <div class="divider settings-divider">{{ _ "or_paste_text" }}</div>

                    <div class="form-group">
                        <label class="form-label" for="ssl_cert_text">{{ _ "cert_text_label" }}</label>
                        <textarea class="form-input" id="ssl_cert_text" data-secret="clear" rows="4" placeholder="-----BEGIN CERTIFICATE----- ...">{{ get $sslSettings "cert_text" "" }}</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="ssl_key_text">{{ _ "key_text_label" }}</label>
                        <textarea class="form-input" id="ssl_key_text" data-secret="clear" rows="4" placeholder="-----BEGIN PRIVATE KEY----- ...">{{ get $sslSettings "key_text" "" }}</textarea>
                    </div>

                    <p class="form-hint">{{ _ "ssl_hint" }}</p>
                </div>
            </form>
            {{ template "settings_commit" . }}
        </div>
{{- end }}
